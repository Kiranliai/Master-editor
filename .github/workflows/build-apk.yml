name: Build Master Editor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          unzip -o Master_Editor_Android_Source.zip -d source
          find source -name build.gradle -o -name build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd source
          DIR=$(find . -name gradlew -type f | head -1)
          if [ -z "$DIR" ]; then
            echo "Gradle wrapper not found in ZIP"
            exit 1
          fi
          cd "$(dirname "$DIR")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: master-editor-debug-apk
          path: source/**/*.apk
      
